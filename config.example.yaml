# ===== Настройки парсера клиентов =====

# Ключевые слова: лид засчитывается, если в тексте есть хотя бы одно
keywords:
  - сайт
  - лендинг
  - интернет-магазин
  - разработ
  - telegram-бот
  - телеграм бот
  - чат-бот
  - приложени
  - crm
  - автоматизац
  - парсер
  - wordpress
  - tilda
  - битрикс
  - python
  - django
  - react

# Слова-исключения (отбрасываем такие объявления)
stop_words:
  - ищу работу
  - резюме
  - вакансия
  - стажировка
  - бесплатно

# ---------- Фриланс-биржи (RSS) ----------
freelance:
  feeds:
    - name: FL.ru
      url: https://www.fl.ru/rss/all.xml
  # Habr Freelance закрыт с 28.02.2025; Kwork не даёт RSS — его проще мониторить вручную

# ---------- Telegram ----------
telegram:
  # web — без входа, читает публичные каналы через t.me/s/<имя> (ключи не нужны)
  # api — через ваш аккаунт (нужны api_id/api_hash с my.telegram.org), видит и закрытые чаты
  mode: web
  # Каналы/чаты: username без @ или ссылка t.me/...
  chats:
    - FreeVacanciesIT
    - theyseeku
    - kadrof_work
  history_limit: 100        # сколько последних сообщений просмотреть в каждом канале
  check_every_min: 5        # режим слежения (web): как часто проверять
  # --- только для mode: api ---
  api_id: 0
  api_hash: ""
  notify_saved_messages: true  # пересылать найденное в «Избранное»

# ---------- Уведомления в Telegram через бота ----------
# Создайте бота у @BotFather, вставьте токен, напишите боту /start — chat_id найдётся в меню
notify:
  bot_token: ""
  chat_id: ""

# ---------- Карты ----------
maps:
  # Ниши и города для поиска компаний
  niches:
    - стоматология
    - салон красоты
    - автосервис
    - фитнес
  cities:
    - Казань
    - Новосибирск
    - Екатеринбург
  # 2ГИС Catalog API: ключ на https://dev.2gis.ru (есть бесплатный демо-ключ)
  dgis_key: ""
  dgis_pages: 5             # страниц по 10 компаний на каждую пару ниша+город
  # OpenStreetMap — бесплатно, без ключа (данных меньше, чем в 2ГИС)
  use_osm: true
  only_without_site: false  # true = оставлять только компании без сайта

# ---------- Сайты компаний ----------
sites:
  timeout: 15
  check_contacts_page: true   # заходить на /contacts, /kontakty

# ---------- Email-рассылка компаниям ----------
# Пишет компаниям без сайта (из карт) и компаниям с проблемным сайтом (из анализа сайтов).
# Тексты писем: templates/no_site.txt и templates/site_problems.txt. Стоп-лист: stoplist.txt
outreach:
  enabled: false            # автоотправка в фоне (включается в меню: Рассылка)
  smtp_host: smtp.yandex.ru
  smtp_port: 465            # 465 = SSL, 587 = STARTTLS
  smtp_user: ""             # ваш адрес, с него уходят письма
  smtp_password: ""         # ПАРОЛЬ ПРИЛОЖЕНИЯ, не основной пароль от почты
  imap_host: ""             # пусто = smtp.* -> imap.* (для проверки ответов)
  from_name: ""             # имя отправителя
  reply_to: ""              # пусто = smtp_user
  signature: ""             # подпись: имя, чем занимаетесь, Telegram, телефон, портфолио
  sources: [maps, sites]
  min_problems: 2           # писать сайтам, у которых найдено проблем не меньше
  daily_limit: 30           # писем в день (больше 50 с обычного ящика — риск блокировки за спам)
  delay_min_sec: 90         # пауза между письмами: случайная от..до
  delay_max_sec: 240
  hour_from: 10             # отправлять только в рабочее время
  hour_to: 18
  weekdays_only: true
